<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🔥 Fire Detection — Control Center</title>

  <!-- Tailwind CDN for quick styling -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js (for graphs) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    html,
    body {
      height: 100%;
      background: #071026;
      color: #e6eef8;
    }

    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .blink {
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0.35
      }
    }

    /* small responsive tweaks */
    @media (max-width:700px) {
      .grid-cols-3 {
        grid-template-columns: repeat(1, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body class="flex items-center justify-center p-6">
  <div class="card w-full max-w-4xl rounded-2xl p-6 shadow-2xl">
    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-semibold">🔥 Fire Detection Control Center</h1>
        <p class="text-sm text-slate-300/70">Realtime telemetry — ESP32 → Firebase → Dashboard</p>
      </div>
      <div class="text-right">
        <div id="overall-status" class="px-4 py-2 rounded-lg bg-slate-800/50 text-slate-200 font-semibold">
          Status: <span id="status-text">UNKNOWN</span>
        </div>
        <div id="last-update" class="text-xs text-slate-400 mt-2">Last: --</div>
      </div>
    </header>

    <section class="grid grid-cols-3 gap-4 mb-4">
      <div class="p-4 rounded-lg">
        <div class="text-sm text-slate-300">Temperature (°C)</div>
        <div id="temp" class="text-2xl font-bold">--</div>
      </div>

      <div class="p-4 rounded-lg">
        <div class="text-sm text-slate-300">Smoke</div>
        <div id="smoke" class="text-2xl font-bold">--</div>
      </div>

      <div class="p-4 rounded-lg">
        <div class="text-sm text-slate-300">Flame (raw)</div>
        <div id="flame" class="text-2xl font-bold">--</div>
      </div>
    </section>

    <section class="mb-4">
      <canvas id="realtime-chart" class="rounded-lg bg-black/30 p-2" height="160"></canvas>
    </section>

    <section class="flex items-center justify-between">
      <div class="text-sm text-slate-400">Device UID: <span id="uid">--</span></div>
      <div class="space-x-2">
        <button id="snooze" class="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600">Snooze Alarm</button>
        <button id="testAlert" class="px-3 py-2 rounded bg-amber-600 hover:bg-amber-500">Test Alert</button>
      </div>
    </section>
  </div>

  <!-- load our module -->
  <script type="module" src="./script.js"></script>
</body>

</html>
